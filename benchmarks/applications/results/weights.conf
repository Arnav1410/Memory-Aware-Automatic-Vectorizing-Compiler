# Approximate cycle units, analytic initial priors (not fitted CPU measurements).
# 0.5 load/ALU represents two independent operations per cycle; store/control
# are charged one cycle. See docs/MEMORY_AWARE_REPORT.md for limitations.
setup=12
load=0.5
store=1
alu=0.5
branch=1
guard=3
pressure=1
# Extra cycles/byte for array traffic exceeding the modeled L1 working set.
memory=0.03125
cache=32768
assumed_trip=1024
